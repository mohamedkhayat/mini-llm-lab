name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: check src tests scripts/smoke_cache.py figs/readme train.py chat.py
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: format --check src tests scripts/smoke_cache.py figs/readme train.py chat.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Test
        env:
          WANDB_MODE: disabled
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q

  smoke-train:
    # End-to-end: tokenize a tiny corpus, train a 2-layer model on CPU, checkpoint, resume.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    env:
      WANDB_MODE: disabled
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Build smoke token cache
        run: SMOKE_CACHE_CMD
      - name: Train
        run: SMOKE_TRAIN_CMD
