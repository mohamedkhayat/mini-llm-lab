[project]
name = "mini-llm-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "tiktoken>=0.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "datasets>=2.14",
    "numpy>=1.26",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
