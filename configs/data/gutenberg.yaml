source: files
# Project Gutenberg (51k books, ~19GB). max_files caps raw-loader reads.
# For the entire corpus, build a token cache and set tokenized_dir instead.
files:
  - "data/gutenberg/data/text/*.txt"
max_files: 200
tokenized_dir: null
hf_dataset: null
hf_config: null
text_column: text
split: train
streaming: false
tokenizer_name: gpt2
seq_len: 1024
stride: 512
batch_size: 4
val_ratio: 0.1
shuffle: true
drop_last: true
num_workers: 4
pin_memory: true
persistent_workers: true
seed: 42
