source: files
# Project Gutenberg (51k books, ~19GB). max_files caps how many are read —
# each book is a separate .txt, so this is a cheap way to scale the corpus.
files:
  - "data/gutenberg/data/text/*.txt"
max_files: 200
hf_dataset: null
hf_config: null
text_column: text
split: train
streaming: false
tokenizer_name: gpt2
seq_len: 1024
stride: 512
batch_size: 4
val_ratio: 0.1
shuffle: true
drop_last: true
num_workers: 4
pin_memory: true
persistent_workers: true
seed: 42
