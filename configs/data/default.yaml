# Hugging Face Hub dataset, tokenized to
# data/<hf_dataset>/<tokenizer_name>/{train.bin, eval.bin, meta.json} by
# src/data/prepare.py (train.py runs it automatically when the cache is
# missing or stale). Training reads the .bin files with the sequential
# memmap dataloader (src/data/dataloader.py).
hf_dataset: HuggingFaceFW/finepdfs_edu_50BT-dclm_30BT-fineweb_edu_20BT-shuffled
hf_config: null
# Optional immutable Hugging Face revision. Reprocessed caches reuse the
# revision recorded in their metadata when this is null.
revision: null
text_column: text
file_format: parquet
tokenizer_name: gpt2
# Total tokens to tokenize and cache (train + eval, split by val_ratio).
# The current phase budget lives under training.train_tokens,
# training.continue_tokens, or training.decay_tokens.
max_tokens: 6000000000
seq_len: 1024
val_ratio: 0.1
